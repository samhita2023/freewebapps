<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lucky Scratch — Interactive Foil Card</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e1b4b;
    --card-bg: #ffffff;
    --accent: #f59e0b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
  }

  .header h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #fbbf24 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
  }

  .stats-bar {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .stat-pill {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 4px 12px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-pill strong {
    color: #fbbf24;
  }

  /* Category Selector */
  .categories {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    max-width: 540px;
    margin-bottom: 16px;
  }

  .cat-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e2e8f0;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .cat-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(-1px);
  }

  .cat-btn.active {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border-color: #fbbf24;
    color: #0f172a;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
  }

  /* Scratch Card Container */
  .card-wrapper {
    position: relative;
    width: 320px;
    height: 365px;
    border-radius: 24px;
    padding: 12px;
    background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
    box-shadow:
      0 25px 50px -12px rgba(0, 0, 0, 0.75),
      inset 0 1px 1px rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .card-wrapper.pop {
    animation: cardPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes cardPop {
    0% { transform: scale(0.92) rotate(-1.5deg); }
    60% { transform: scale(1.03) rotate(1deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.12);
  }

  /* Underlying Reveal Content */
  .reveal-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 16px 14px;
    text-align: center;
    z-index: 1;
  }

  .reveal-badge {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: #e2e8f0;
    color: #334155;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .reveal-visual {
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 118px;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.14));
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .reveal-emoji {
    font-size: 5.2rem;
    line-height: 1.05;
  }

  .letter-figure-hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .big-symbol {
    font-size: 4.5rem;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .pair-emoji {
    font-size: 4.2rem;
    line-height: 1;
  }

  /* Flag + Continent Map Composite Card */
  .geo-hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 8px 12px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.07);
  }

  .geo-flag-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 74px;
  }

  .geo-flag-emoji {
    font-size: 3.6rem;
    line-height: 1;
  }

  .geo-flag-tag {
    font-size: 0.62rem;
    font-weight: 800;
    color: #64748b;
    letter-spacing: 0.06em;
    margin-top: 3px;
    text-transform: uppercase;
  }

  .geo-map-box {
    position: relative;
    width: 112px;
    height: 92px;
    background: #eff6ff;
    border: 1.5px solid #bfdbfe;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .geo-map-tag {
    position: absolute;
    bottom: 3px;
    right: 5px;
    background: rgba(15, 23, 42, 0.72);
    color: #ffffff;
    font-size: 0.56rem;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    letter-spacing: 0.03em;
  }

  .reveal-layer.revealed .reveal-visual {
    transform: scale(1.07);
  }

  .reveal-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 4px;
    line-height: 1.18;
  }

  .reveal-sub {
    font-size: 0.84rem;
    color: #475569;
    font-weight: 600;
    line-height: 1.3;
    max-width: 262px;
  }

  .geo-pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    margin-top: 5px;
  }

  .geo-pill {
    font-size: 0.73rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .geo-pill.cap {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
  }

  .geo-pill.cont {
    background: #dbeafe;
    color: #1e40af;
    border: 1px solid #bfdbfe;
  }

  /* Foil & Particle Canvases */
  canvas#foilCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    touch-action: none;
    cursor: none;
    transition: opacity 0.45s ease;
  }

  canvas#fxCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 50;
  }

  /* Custom Coin Cursor */
  .coin-cursor {
    position: fixed;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 40;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 30% 30%, #fef08a, #eab308 55%, #a16207 100%);
    border: 2px solid #fef9c3;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45), inset 0 0 6px rgba(255, 255, 255, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 1.05rem;
    color: #713f12;
  }

  /* Controls */
  .controls {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 320px;
  }

  .progress-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-muted);
    gap: 10px;
  }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f59e0b, #fde047);
    transition: width 0.12s ease-out;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .new-btn {
    flex: 1;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    transition: transform 0.15s ease, filter 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .new-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .new-btn:active {
    transform: translateY(1px);
  }

  .sound-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #f8fafc;
    width: 46px;
    border-radius: 14px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .sound-btn:hover {
    background: rgba(255, 255, 255, 0.16);
  }
</style>
</head>
<body>

  <div class="header">
    <h1>✨ LUCKY SCRATCH ✨</h1>
    <div class="stats-bar">
      <div class="stat-pill">Cards Revealed: <strong id="cardCount">0</strong></div>

  <div class="controls">

    </div>
  </div>

  <div class="coin-cursor" id="coinCursor">₹</div>
  <canvas id="fxCanvas"></canvas>

  function buildContinentMapSVG(continent, highlightShapeSVG, highlightColor = "#ef4444") {
    const c = CONTINENT_SHAPES[continent];
    return `
      <svg width="110" height="90" viewBox="0 0 120 92">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="${highlightColor}" flood-opacity="0.55"/>

        <!-- Subtle lat/long grid -->

        <line x1="80" y1="0" x2="80" y2="92" stroke="#dbeafe" stroke-width="1"/>
        <!-- Continent silhouette -->
        <path d="${c.basePath}" fill="#cbd5e1" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>

      flakeColors: ["#f472b6", "#60a5fa", "#34d399", "#fde047"],
      textColor: "#1e1b4b"
    },
    {
      name: "Emerald Foil",
      stops: ["#065f46", "#10b981", "#a7f3d0", "#059669", "#064e3b"],
      flakeColors: ["#a7f3d0", "#34d399", "#10b981", "#ffffff"],
      textColor: "#022c22"
    },
    {
      name: "Cobalt Sapphire",
      stops: ["#1e3a8a", "#3b82f6", "#bae6fd", "#2563eb", "#172554"],
      flakeColors: ["#bae6fd", "#60a5fa", "#3b82f6", "#ffffff"],
      textColor: "#0f172a"
    },
    {
      name: "Royal Amethyst",
      stops: ["#4c1d95", "#8b5cf6", "#ddd6fe", "#7c3aed", "#2e1065"],
      flakeColors: ["#ddd6fe", "#a78bfa", "#8b5cf6", "#ffffff"],
      textColor: "#1e1b4b"
    },
    {
      name: "Burnished Copper",
      stops: ["#7c2d12", "#ea580c", "#fed7aa", "#c2410c", "#431407"],
      flakeColors: ["#fed7aa", "#fb923c", "#ea580c", "#ffffff"],
      textColor: "#270c04"
    }
  ];

  // --- STATE ---
  let currentCategory = "all";
  let currentFoil = FOIL_THEMES[0];
  let isDrawing = false;
  let isRevealed = false;
  let lastPoint = null;
  let cardsRevealedCount = 0;
  let soundEnabled = true;
  let lastItemName = "";
  let currentSpeechText = "";

  // --- DOM ELEMENTS ---
  const foilCanvas = document.getElementById("foilCanvas");
  const fCtx = foilCanvas.getContext("2d", { willReadFrequently: true });
  const fxCanvas = document.getElementById("fxCanvas");
  const fxCtx = fxCanvas.getContext("2d");
  const cardWrapper = document.getElementById("cardWrapper");
  const revealLayer = document.getElementById("revealLayer");
  const coinCursor = document.getElementById("coinCursor");
  const progressFill = document.getElementById("progressFill");
  const pctText = document.getElementById("pctText");
  const cardCountEl = document.getElementById("cardCount");
  const foilNameEl = document.getElementById("foilName");

  // --- AUDIO ENGINE (Web Audio API) ---
  let audioCtx = null;
  let lastScratchSound = 0;

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function playScratchSound() {
    if (!soundEnabled) return;
    const now = performance.now();
    if (now - lastScratchSound < 45) return;
    lastScratchSound = now;

    ensureAudio();
    const duration = 0.045;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.6));
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 2400 + Math.random() * 1400;
    filter.Q.value = 1.8;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  }

  function playWinFanfare() {
    if (!soundEnabled) return;
    ensureAudio();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime + idx * 0.08);
      gain.gain.linearRampToValueAtTime(0.14, audioCtx.currentTime + idx * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.08);
      osc.stop(audioCtx.currentTime + idx * 0.08 + 0.38);
    });
  }

  // --- VOICE SHOUT-OUT ENGINE (Web Speech API) ---
  function shoutOutSurprise(speechPhrase) {
    if (!soundEnabled || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(speechPhrase);
    utterance.rate = 0.98;
    utterance.pitch = 1.18;
    utterance.volume = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const preferred =
      voices.find(v => /en/i.test(v.lang) && /(Google|Samantha|Daniel|Natural|Premium|Female)/i.test(v.name)) ||
      voices.find(v => /en/i.test(v.lang));
    if (preferred) utterance.voice = preferred;

    window.speechSynthesis.speak(utterance);
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // --- PARTICLE & CONFETTI SYSTEM ---
  let particles = [];

  function resizeFxCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeFxCanvas);
  resizeFxCanvas();

  function spawnScratchParticles(clientX, clientY) {
    for (let i = 0; i < 6; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3.5;
      const color = currentFoil.flakeColors[Math.floor(Math.random() * currentFoil.flakeColors.length)];
      particles.push({
        x: clientX + (Math.random() - 0.5) * 14,
        y: clientY + (Math.random() - 0.5) * 14,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.2,
        size: 3 + Math.random() * 4,
        color,
        alpha: 1,
        gravity: 0.16,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.3,
        type: "flake"
      });
    }
  }

  function spawnConfettiBurst() {
    const rect = cardWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const colors = ["#f59e0b", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6", "#fde047"];

    for (let i = 0; i < 85; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 9;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        gravity: 0.22,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        type: "confetti"
      });
    }
  }

  function animateParticles() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.rotation += p.vRot;
      p.alpha -= p.type === "flake" ? 0.032 : 0.014;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.alpha);
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rotation);
      fxCtx.fillStyle = p.color;
      if (p.type === "confetti") {
        fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // --- PICK RANDOM ITEM & FOIL ---
  function pickRandomItem() {
    let pool = [];
    if (currentCategory === "all") {
      Object.entries(ITEMS).forEach(([catKey, list]) => {
        list.forEach(item => pool.push({ ...item, catKey }));
      });
    } else {
      ITEMS[currentCategory].forEach(item => pool.push({ ...item, catKey: currentCategory }));
    }

    let chosen = pool[Math.floor(Math.random() * pool.length)];
    if (pool.length > 1 && chosen.name === lastItemName) {
      chosen = pool[(pool.indexOf(chosen) + 1) % pool.length];
    }
    lastItemName = chosen.name;

    const catLabels = {
      letters: "🔤 LETTER",
      numbers: "🔢 FIGURE",
      shapes: "🔷 SHAPE",
      animals: "🦁 ANIMAL",
      flowers: "🌸 FLOWER",
      birds: "🦜 BIRD",
      nature: "🏔️ NATURE",
      flags: "🗺️ COUNTRY & MAP",
      fruits: "🍎 FRUIT",
      vegetables: "🥕 VEGETABLE"
    };

    document.getElementById("itemCategory").textContent = catLabels[chosen.catKey] || "SURPRISE";

    const visualBox = document.getElementById("itemVisual");
    const subBox = document.getElementById("itemSub");

    if (chosen.catKey === "flags") {
      const mapSVG = buildContinentMapSVG(chosen.continent, chosen.regionSVG, chosen.highlightColor);
      const contLabel = CONTINENT_SHAPES[chosen.continent].label;
      visualBox.innerHTML = `
        <div class="geo-hero">
          <div class="geo-flag-box">
            <span class="geo-flag-emoji">${chosen.emoji}</span>
            <span class="geo-flag-tag">Flag</span>
          </div>
          <div class="geo-map-box">
            ${mapSVG}
            <span class="geo-map-tag">${contLabel}</span>
          </div>
        </div>
      `;
      document.getElementById("itemTitle").textContent = chosen.name;
      subBox.innerHTML = `
        <div class="geo-pills">
          <span class="geo-pill cap">🏛️ Capital: ${chosen.capital}</span>
          <span class="geo-pill cont">🌍 Continent: ${chosen.continent}</span>
        </div>
      `;
      currentSpeechText = `${chosen.name}! Capital: ${chosen.capital}. Continent: ${chosen.continent}.`;
    } else {
      if (chosen.svg) {
        visualBox.innerHTML = chosen.svg;
      } else if (chosen.symbol) {
        visualBox.innerHTML = `<div class="letter-figure-hero"><span class="big-symbol">${chosen.symbol}</span><span class="pair-emoji">${chosen.emoji}</span></div>`;
      } else {
        visualBox.innerHTML = `<div class="reveal-emoji">${chosen.emoji}</div>`;
      }
      document.getElementById("itemTitle").textContent = chosen.name;
      subBox.textContent = chosen.sub;
      currentSpeechText = chosen.speak || (chosen.name + "!");
    }
  }

  function pickRandomFoil() {
    let nextFoil = FOIL_THEMES[Math.floor(Math.random() * FOIL_THEMES.length)];
    if (nextFoil.name === currentFoil.name) {
      nextFoil = FOIL_THEMES[(FOIL_THEMES.indexOf(nextFoil) + 1) % FOIL_THEMES.length];
    }
    currentFoil = nextFoil;
    foilNameEl.textContent = currentFoil.name;
  }

  // --- RENDER METALLIC FOIL TEXTURE ---
  function renderFoil() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = foilCanvas.getBoundingClientRect();
    const w = rect.width || 296;
    const h = rect.height || 341;

    foilCanvas.width = w * dpr;
    foilCanvas.height = h * dpr;
    fCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fCtx.globalCompositeOperation = "source-over";
    foilCanvas.style.opacity = "1";

    // Base diagonal metallic gradient
    const grad = fCtx.createLinearGradient(0, 0, w, h);
    const stops = currentFoil.stops;
    stops.forEach((col, idx) => {
      grad.addColorStop(idx / (stops.length - 1), col);
    });
    fCtx.fillStyle = grad;
    fCtx.fillRect(0, 0, w, h);

    // Brushed metallic micro-grain lines
    fCtx.save();
    fCtx.globalAlpha = 0.08;
    for (let y = 0; y < h; y += 2) {
      fCtx.fillStyle = y % 4 === 0 ? "#ffffff" : "#000000";
      fCtx.fillRect(0, y, w, 1);
    }
    fCtx.restore();

    // Security Guilloche Wave Pattern
    fCtx.save();
    fCtx.strokeStyle = "rgba(255, 255, 255, 0.22)";
    fCtx.lineWidth = 1;
    for (let row = 20; row < h; row += 28) {
      fCtx.beginPath();
      for (let x = 0; x <= w; x += 6) {
        const y = row + Math.sin(x * 0.05 + row) * 6;
        if (x === 0) fCtx.moveTo(x, y);
        else fCtx.lineTo(x, y);
      }
      fCtx.stroke();
    }
    fCtx.restore();

    // Diagonal light sheen
    const sheen = fCtx.createLinearGradient(0, h * 0.2, w, h * 0.8);
    sheen.addColorStop(0, "rgba(255,255,255,0)");
    sheen.addColorStop(0.45, "rgba(255,255,255,0.38)");
    sheen.addColorStop(0.55, "rgba(255,255,255,0.05)");
    sheen.addColorStop(1, "rgba(255,255,255,0)");
    fCtx.fillStyle = sheen;
    fCtx.fillRect(0, 0, w, h);

    // Embossed Stamp Emblem
    fCtx.save();
    fCtx.translate(w / 2, h / 2);
    fCtx.strokeStyle = currentFoil.textColor;
    fCtx.globalAlpha = 0.45;
    fCtx.lineWidth = 2;
    fCtx.setLineDash([6, 4]);
    fCtx.beginPath();
    fCtx.arc(0, 0, 74, 0, Math.PI * 2);
    fCtx.stroke();

    fCtx.setLineDash([]);
    fCtx.globalAlpha = 0.72;
    fCtx.fillStyle = currentFoil.textColor;
    fCtx.font = "800 18px system-ui, sans-serif";
    fCtx.textAlign = "center";
    fCtx.textBaseline = "middle";
    fCtx.fillText("SCRATCH", 0, -10);
    fCtx.font = "700 13px system-ui, sans-serif";
    fCtx.fillText("TO REVEAL", 0, 12);
    fCtx.restore();
  }

  // --- SCRATCH MECHANICS ---
  function getCanvasPos(e) {
    const rect = foilCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top,
      clientX,
      clientY
    };
  }

  function scratchAt(pos) {
    if (isRevealed) return;
    fCtx.globalCompositeOperation = "destination-out";
    fCtx.lineCap = "round";
    fCtx.lineJoin = "round";
    fCtx.lineWidth = 38;

    fCtx.beginPath();
    if (lastPoint) {
      fCtx.moveTo(lastPoint.x, lastPoint.y);
      fCtx.lineTo(pos.x, pos.y);
    } else {
      fCtx.arc(pos.x, pos.y, 19, 0, Math.PI * 2);
    }
    fCtx.stroke();
    lastPoint = pos;

    playScratchSound();
    spawnScratchParticles(pos.clientX, pos.clientY);
    checkScratchPercentage();
  }

  let checkThrottle = 0;
  function checkScratchPercentage() {
    const now = performance.now();
    if (now - checkThrottle < 90 || isRevealed) return;
    checkThrottle = now;

    const imgData = fCtx.getImageData(0, 0, foilCanvas.width, foilCanvas.height).data;
    let cleared = 0;
    const step = 32;
    let totalSamples = 0;

    for (let i = 3; i < imgData.length; i += step) {
      totalSamples++;
      if (imgData[i] < 128) cleared++;
    }

    const pct = Math.min(100, Math.round((cleared / totalSamples) * 100));
    progressFill.style.width = `${pct}%`;
    pctText.textContent = `${pct}%`;

    if (pct >= 58) {
      triggerFullReveal();
    }
  }

  function triggerFullReveal() {
    if (isRevealed) return;
    isRevealed = true;
    progressFill.style.width = "100%";
    pctText.textContent = "100%";

    foilCanvas.style.opacity = "0";
    revealLayer.classList.add("revealed");

    cardsRevealedCount++;
    cardCountEl.textContent = cardsRevealedCount;

    playWinFanfare();
    shoutOutSurprise(currentSpeechText);
    spawnConfettiBurst();
  }

  // --- POINTER & TOUCH EVENTS ---
  foilCanvas.addEventListener("pointerdown", (e) => {
    isDrawing = true;
    lastPoint = null;
    const pos = getCanvasPos(e);
    scratchAt(pos);
  });

  window.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse") {
      const rect = foilCanvas.getBoundingClientRect();
      const inside =
        e.clientX >= rect.left &&
        e.clientX <= rect.right &&
        e.clientY >= rect.top &&
        e.clientY <= rect.bottom;
      if (inside && !isRevealed) {
        coinCursor.style.display = "flex";
        coinCursor.style.left = `${e.clientX}px`;
        coinCursor.style.top = `${e.clientY}px`;
      } else {
        coinCursor.style.display = "none";
      }
    }

    if (!isDrawing) return;
    const pos = getCanvasPos(e);
    scratchAt(pos);
  });

  window.addEventListener("pointerup", () => {
    isDrawing = false;
    lastPoint = null;
  });

  // --- NEW CARD & CATEGORY SWITCHING ---
  function initNewCard() {
    isRevealed = false;
    isDrawing = false;
    lastPoint = null;
    progressFill.style.width = "0%";
    pctText.textContent = "0%";
    revealLayer.classList.remove("revealed");

    pickRandomFoil();
    pickRandomItem();
    renderFoil();

    cardWrapper.classList.remove("pop");
    void cardWrapper.offsetWidth;
    cardWrapper.classList.add("pop");
  }

  document.getElementById("newCardBtn").addEventListener("click", initNewCard);

  document.getElementById("soundToggle").addEventListener("click", (e) => {
    soundEnabled = !soundEnabled;
    if (!soundEnabled && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    e.currentTarget.textContent = soundEnabled ? "🔊" : "🔇";
  });

  document.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = btn.dataset.cat;
      initNewCard();
    });
  });

  // Initialize first card
  initNewCard();
})();
</script>
