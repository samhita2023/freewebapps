<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Handheld Water Ring Toss</title>
    <style>
        body {
            background-color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* The Game Console Body */
        .console {
            background: linear-gradient(135deg, #ff5e62, #ff9966);
            width: 360px;
            height: 520px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 -8px 0 rgba(0,0,0,0.2), inset 0 8px 0 rgba(255,255,255,0.4);
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            border: 4px solid #e04d51;
        }

        /* Screen / Water Tank Container */
        .screen-container {
            background-color: #333;
            border-radius: 20px;
            padding: 12px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
        }

        canvas {
            background: linear-gradient(to bottom, #94e4f7, #3baed2);
            display: block;
            border-radius: 10px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
            width: 100%;
            height: 320px;
        }

        /* Controls Area */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 35px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .push-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, #2af598 0%, #009efd 100%);
            border: 3px solid #fff;
            box-shadow: 0 6px 0 #0076c0, 0 8px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
            transition: all 0.05s ease;
        }

        .push-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0076c0, 0 4px 6px rgba(0,0,0,0.4);
        }

        .btn-label {
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .brand {
            margin-top: auto;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="console">
        <div class="screen-container">
            <canvas id="waterTank" width="300" height="320"></canvas>
        </div>
        
        <div class="controls">
            <div class="btn-wrapper">
                <button class="push-btn" id="leftBtn"></button>
                <span class="btn-label">PUSH L</span>
            </div>
            <div class="btn-wrapper">
                <button class="push-btn" id="rightBtn"></button>
                <span class="btn-label">PUSH R</span>
            </div>
        </div>

        <div class="brand">AQUA TOSS 2026</div>
    </div>

    <script>
        const canvas = document.getElementById('waterTank');
        const ctx = canvas.getContext('2d');

        // Web Audio Setup
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Procedural Bubble Push Sound Effect
        function playBubbleSound() {
            initAudio();
            if (!audioCtx) return;

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            
            // Fast slide down & up mimicking shifting water pockets
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }

        // Procedural Ring Catching "Ping" Sound Effect
        function playCatchSound() {
            initAudio();
            if (!audioCtx) return;

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.06); // High-pitched click chime
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        // Physics constants
        const GRAVITY = 0.04;
        const WATER_DRAG = 0.97;
        const BUOYANCY = -0.01;

        // Peg Configuration
        const pegs = [
            { x: 95, y: 140, width: 8, height: 100 },  // Left Peg
            { x: 205, y: 140, width: 8, height: 100 }  // Right Peg
        ];

        let bubbles = [];
        let rings = [];
        const colors = ['#FF4136', '#FFDC00', '#2ECC40', '#B10DC9', '#FF851B', '#0074D9'];
        
        // Ring Dimension Setup (Simulating Isometric View)
        // From the side, width is wider than height to look flattened
        const RING_RADIUS_X = 16; 
        const RING_RADIUS_Y = 5;  
        const RING_THICKNESS = 4;

        for (let i = 0; i < 12; i++) {
            rings.push({
                x: 50 + Math.random() * 200,
                y: 260 + Math.random() * 40,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                color: colors[i % colors.length],
                isCaught: false,
                caughtPeg: null,
                rotation: (Math.random() - 0.5) * 0.3 // Free-floating tilt
            });
        }

        function pushWater(side) {
            playBubbleSound();
            const blastX = side === 'left' ? 70 : 230;
            const blastY = 320;

            for (let i = 0; i < 15; i++) {
                bubbles.push({
                    x: blastX + (Math.random() - 0.5) * 30,
                    y: blastY - Math.random() * 20,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -3 - Math.random() * 5,
                    radius: 2 + Math.random() * 4,
                    alpha: 1
                });
            }

            rings.forEach(ring => {
                // If firmly resting near the base of the peg, it requires a stronger burst to displace
                if (ring.isCaught && ring.y > ring.caughtPeg.y + 40) {
                    let dx = ring.x - blastX;
                    let dy = ring.y - blastY;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > 130) return; 
                }

                let dx = ring.x - blastX;
                let dy = ring.y - blastY;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 190) {
                    let force = (190 - distance) / 9;
                    ring.vy -= force * 0.75;
                    ring.vx += (dx / distance) * force * 0.45;
                    
                    if (ring.isCaught && Math.random() > 0.3) {
                        ring.isCaught = false; 
                        ring.caughtPeg = null;
                    }
                }
            });
        }

        // Event Listeners
        const handleLeft = (e) => { e.preventDefault(); pushWater('left'); };
        const handleRight = (e) => { e.preventDefault(); pushWater('right'); };

        document.getElementById('leftBtn').addEventListener('mousedown', handleLeft);
        document.getElementById('rightBtn').addEventListener('mousedown', handleRight);
        document.getElementById('leftBtn').addEventListener('touchstart', handleLeft);
        document.getElementById('rightBtn').addEventListener('touchstart', handleRight);

        function update() {
            // Update bubbles
            bubbles.forEach((b, index) => {
                b.x += b.vx;
                b.y += b.vy;
                b.alpha -= 0.02;
                if (b.alpha <= 0 || b.y < 0) bubbles.splice(index, 1);
            });

            // Update rings
            rings.forEach(ring => {
                if (!ring.isCaught) {
                    ring.vy += GRAVITY + BUOYANCY;
                    ring.vx *= WATER_DRAG;
                    ring.vy *= WATER_DRAG;

                    ring.x += ring.vx;
                    ring.y += ring.vy;

                    // Rotational spin dynamic when floating freely
                    ring.rotation += ring.vx * 0.02;

                    // Wall Collisions
                    if (ring.x - RING_RADIUS_X < 0) { ring.x = RING_RADIUS_X; ring.vx *= -0.5; }
                    if (ring.x + RING_RADIUS_X > canvas.width) { ring.x = canvas.width - RING_RADIUS_X; ring.vx *= -0.5; }
                    if (ring.y - RING_RADIUS_Y < 0) { ring.y = RING_RADIUS_Y; ring.vy *= -0.5; }
                    if (ring.y + RING_RADIUS_Y > canvas.height - RING_RADIUS_Y) { ring.y = canvas.height - RING_RADIUS_Y; ring.vy *= -0.3; }

                    // Check Peg Hooking
                    pegs.forEach(peg => {
                        let pegCenterX = peg.x + peg.width / 2;
                        // Checking if ring center drops directly onto the peg line
                        if (ring.x > peg.x - 6 && ring.x < peg.x + peg.width + 6) {
                            if (ring.y > peg.y && ring.y < peg.y + peg.height) {
                                if (ring.vy > 0) { 
                                    ring.isCaught = true;
                                    ring.caughtPeg = peg;
                                    ring.vx = 0;
                                    playCatchSound();
                                }
                            }
                        }
                    });
                } else {
                    // Locked Mode (Sliding down / Stacked on peg)
                    ring.vx = 0;
                    ring.rotation *= 0.8; // Level out flat horizontally when caught

                    let pegCenterX = ring.caughtPeg.x + (ring.caughtPeg.width / 2);
                    ring.x += (pegCenterX - ring.x) * 0.2; 

                    let baseFloor = ring.caughtPeg.y + ring.caughtPeg.height - RING_THICKNESS;
                    
                    if (ring.y < baseFloor) {
                        ring.vy += GRAVITY * 0.5;
                        ring.y += ring.vy;
                    } else {
                        ring.y = baseFloor;
                        ring.vy = 0;
                    }

                    // Strict Stacking Separation
                    rings.forEach(otherRing => {
                        if (otherRing !== ring && otherRing.isCaught && otherRing.caughtPeg === ring.caughtPeg) {
                            let dy = otherRing.y - ring.y;
                            // Check if resting on top of another flat ring layer
                            if (dy > 0 && dy < (RING_THICKNESS * 2.2)) {
                                ring.y = otherRing.y - (RING_THICKNESS * 2.2);
                                ring.vy = 0;
                            }
                        }
                    });
                }
            });
        }

        // Render Canvas Graphics
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw BACK section of the Pegs (Creates an illusion that the peg is inserted INSIDE the ring hole)
            pegs.forEach(peg => {
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = 0.4;
                ctx.fillRect(peg.x, peg.y, peg.width, peg.height);
                
                // Peg Tip Cap
                ctx.beginPath();
                ctx.arc(peg.x + peg.width/2, peg.y, peg.width/2, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 2. Draw Bubbles
            bubbles.forEach(b => {
                ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Draw Side-View Flattened Rings
            rings.forEach(ring => {
                ctx.save();
                ctx.translate(ring.x, ring.y);
                ctx.rotate(ring.rotation);

                ctx.lineWidth = RING_THICKNESS;
                ctx.strokeStyle = ring.color;

                // Subtle shading shadow
                ctx.shadowColor = 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 3;
                ctx.shadowOffsetY = 2;

                // Render as flattened Ellipse to get accurate side profiles
                ctx.beginPath();
                ctx.ellipse(0, 0, RING_RADIUS_X, RING_RADIUS_Y, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            });
        }

        // Execution Framework Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
